# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*.bb \
            ${LAYERDIR}/recipes-*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "image-assembler"
BBFILE_PATTERN_image-assembler = "^${LAYERDIR}/"
BBFILE_PRIORITY_image-assembler = "6"

LAYERDEPENDS_image-assembler = "core"
LAYERSERIES_COMPAT_image-assembler = "kirkstone"

# To make the community specific config changes.
IMAGE_CLASSES:append = " rdkv-community-configs"

# TODO: temporary; remove when RDKVREFPLT-5105 is resolved.
LOCALCONF_VERSION = "1"

# TODO: remove when these are fixed CMFSUPPORT-3989, CMFSUPPORT-3990, RDKEAPPRT-609
FACTORY_APPS_JSON_FILE ?= "${LAYERDIR}/factory-app-manifest.json"
